spring.profiles.include=secret

# Database connection details (URL and credentials loaded from application-secret.properties or environment variables)
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool settings optimized for Neon Serverless PostgreSQL
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://alert-muskox-18.clerk.accounts.dev
